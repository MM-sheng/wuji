name: wuji
x-runtime: &runtime
  build: .
  image: wuji-node:local
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  restart: unless-stopped
  environment: &public-env
    MANIFEST: ${MANIFEST:-contracts/deployments/sepolia-weth-v3.json}
    RPC: ${RPC:-}
    BITCOIN_API: ${BITCOIN_API:-https://mempool.space/api,https://blockstream.info/api}
    BITCOIN_API_KIND: ${BITCOIN_API_KIND:-esplora}
    BITCOIN_REQUEST_DELAY_MS: ${BITCOIN_REQUEST_DELAY_MS:-}
services:
  indexer:
    <<: *runtime
    command: [indexer]
    ports: ["127.0.0.1:${WUJI_PORT:-8794}:8789"]
    volumes: ["index-data:/data"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8789/head').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
  keeper:
    <<: *runtime
    profiles: [keeper]
    command: [keeper]
    environment:
      <<: *public-env
      KEYSTORE_ACCOUNT: ${KEYSTORE_ACCOUNT:-wuji-operator}
      PASSWORD_FILE: /run/secrets/keeper-password
      INTERVAL: ${KEEPER_INTERVAL:-45}
    volumes:
      - type: bind
        source: ${KEYSTORE_FILE:-./operator/keystore.json}
        target: /home/node/.foundry/keystores/${KEYSTORE_ACCOUNT:-wuji-operator}
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${PASSWORD_FILE:-./operator/password}
        target: /run/secrets/keeper-password
        read_only: true
        bind: {create_host_path: false}
  # T12 watcher. Alert-only by default (no key: checks and logs, never sends). To dispute, refute and back,
  # add a compose override mounting an encrypted keystore and password exactly as for `keeper`, and set
  # KEYSTORE_ACCOUNT; the account needs DISPUTE_BOND (0.05 Sepolia ETH) plus gas. See docs/tasks/T12_WATCHER.md.
  zk-watcher:
    <<: *runtime
    profiles: [zk-watcher]
    command: [zk-watcher]
    environment:
      MANIFEST: ${ZK_MANIFEST:-contracts/deployments/sepolia-zk-t12-v2.json}
      RPC: ${ZK_RPC:-}
      BITCOIN_API: ${BITCOIN_API:-https://mempool.space/api,https://blockstream.info/api}
      WATCH_SOURCES: ${WATCH_SOURCES:-p2p,http}
      INTERVAL: ${WATCH_INTERVAL:-300}
    volumes: ["zk-watch-data:/data"]
volumes:
  index-data:
  zk-watch-data:
