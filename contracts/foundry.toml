[profile.default]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "prague"
via_ir = false
bytecode_hash = "ipfs"
cbor_metadata = true
use_literal_content = false
auto_detect_remappings = false
# Release contexts also live in remappings-v3.json. verify-bytecode.sh recompiles
# Standard JSON with that literal list, removing Foundry's checkout-path aliases.
remappings = [
  "/Users/m/Projects/wuji/contracts/lib/openzeppelin-contracts/:forge-std/=lib/openzeppelin-contracts/lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "erc4626-tests/=lib/openzeppelin-contracts/lib/erc4626-tests/",
  "forge-std/=lib/forge-std/src/",
  "halmos-cheatcodes/=lib/openzeppelin-contracts/lib/halmos-cheatcodes/src/",
  "openzeppelin-contracts/=lib/openzeppelin-contracts/",
  "lib/openzeppelin-contracts/:forge-std/=lib/openzeppelin-contracts/lib/forge-std/src/"
]
src = "src"
out = "out"
libs = ["lib"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read", path = "./deployments" }, { access = "read", path = "./cache/replay" }]

[invariant]
runs = 64
depth = 60
fail_on_revert = true
